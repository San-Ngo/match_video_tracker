# BoT-SORT tracker settings for Milestone 2 (a copy of Ultralytics' botsort.yaml).
# Skill 5: the tracker predicts where each player will be, then matches the new boxes.
# Change the numbers here, run m2_track.py again, and compare the ID counts it prints.

tracker_type: botsort
track_high_thresh: 0.25   # boxes at least this confident are matched first
track_low_thresh: 0.1     # weaker boxes (half-hidden players) get a second chance to match
new_track_thresh: 0.25    # a box with no match starts a new ID only if it is this confident
track_buffer: 30          # frames a lost player keeps his ID (30 frames = 0.5 s in a 60 fps clip)
match_thresh: 0.8         # how strict matching is: lower = stricter
fuse_score: True          # also use the box confidence when matching

# BoT-SORT extras
gmc_method: sparseOptFlow # follows the camera's movement (pans), so moving players match better

# ReID (matching by appearance) is off: it needs an extra model and is slower
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
